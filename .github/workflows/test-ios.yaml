name: iOS tests

on:
  workflow_call:
    inputs:
      skip-everything:
        description: "Skips all the individual steps so the job passes quickly"
        required: false
        default: false
        type: boolean
    secrets:
      SENTRY_DSN:
        required: false
      FIREBASE_KEY:
        required: false
      GOOGLE_APP_ID_IOS:
        required: false

jobs:
  test-ios:
    name: Test for iOS
    runs-on: xcode-27-xlarge
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.skip-everything }}
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        if: ${{ !inputs.skip-everything }}
        with:
          for: ios-test
      - name: shared checks & unit tests
        if: ${{ !inputs.skip-everything }}
        run: ./gradlew shared:iosSimulatorArm64Test
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && !inputs.skip-everything
        with:
          name: ios-shared-reports
          path: shared/build/reports
      - name: Add build environment variables
        if: ${{ !inputs.skip-everything }}
        run: |
          {
            echo "export SENTRY_DSN=${SENTRY_DSN}"
            echo "export SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT}"
            echo "export FIREBASE_KEY=${FIREBASE_KEY}"
            echo "export GOOGLE_APP_ID_IOS=${GOOGLE_APP_ID_IOS}"
          } >> .envrc
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: staging
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY || 'AIzaSyA00000000000000000000000000000000' }}
          GOOGLE_APP_ID_IOS: ${{ secrets.GOOGLE_APP_ID_IOS || '1:123456789000:ios:0123456789abcdef' }}
      - name: Get latest two iOS versions
        if: ${{ !inputs.skip-everything }}
        id: ios_versions
        run: |
          DEVICES=$(xcrun simctl list devices | awk '/^-- iOS/ {v=$3; next} v && /iPhone/ {print $1, $2, $3, "("v")"; v=""}' | sort -r | awk -F'[(.]' '!seen[$1]++')
          LATEST_DEVICE=$(echo "$DEVICES" | head -n 1)
          echo "LATEST_DEVICE=$LATEST_DEVICE" >> $GITHUB_OUTPUT
      - name: Run emulator tests
        if: ${{ !inputs.skip-everything }}
        run: |
          bundle exec fastlane ios test \
            xcodebuild_formatter:"xcbeautify --quieter --is-ci --renderer github-actions" \
            device:"${IOS_DEVICE}"
        env:
          IOS_DEVICE: ${{ steps.ios_versions.outputs.LATEST_DEVICE }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && !inputs.skip-everything
        with:
          name: ios-ios-results
          path: fastlane/test_output/*
